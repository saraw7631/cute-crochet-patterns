const projects=[
{id:"market-square-carryall",title:"The Market-Square Carryall",category:"Bag Study",level:"Easy",date:"September 8, 2026",image:"./assets/granny-square-tote.webp",excerpt:"A modular everyday tote built from tidy granny squares, strong joins and a reinforced upper edge.",content:`<p>A granny-square bag is one of those projects that feels relaxed while you make it but surprisingly polished once everything is joined. This version uses repeated motifs to build a roomy carryall with enough structure for errands, yarn shopping or a casual day out.</p><h2>Start with the fabric, not the bag</h2><p>The finished shape depends heavily on the character of each square. A smooth medium-weight cotton or cotton blend keeps the motifs defined and limits excessive stretching. Make a sample square first, wash or block it, then measure the final size before deciding how many motifs you want in the body.</p><div class="note"><strong>Workshop note:</strong> A restrained palette often makes a modular bag look more intentional. Two main shades and one small accent color are usually enough.</div><h2>Make a matching set</h2><p>Work each square to the same measurement and keep the corner structure consistent. If your tension changes from day to day, group motifs by size as you go instead of discovering a mismatch during assembly. Weave in tails before blocking so the pieces are ready to arrange.</p><h2>Plan the assembly on a table</h2><p>Lay out the full front and back before joining. Move individual squares until color placement feels balanced. Join with a flat seam, a neat slip-stitch join or a sewn method, keeping the seam tension relaxed so the panels do not pucker.</p><h2>Strengthen the opening and handles</h2><p>Once the body is assembled, work a firm border around the upper edge. Mark handle positions on both sides before beginning them. Dense stitches are useful here because the top of a tote receives far more strain than the center of a motif.</p><h2>Finish for everyday use</h2><p>Reinforce the handle bases, inspect the seams and consider adding a simple fabric lining if the bag will carry keys, books or groceries. The result keeps the handmade rhythm of granny squares while functioning like a genuinely useful everyday bag.</p>`},
{id:"garden-daisy-throw",title:"Garden Daisy Throw",category:"Blanket Notes",level:"Easy–Intermediate",date:"September 6, 2026",image:"./assets/daisy-granny-blanket.webp",excerpt:"Soft floral squares repeat across a calm throw with raised daisy centers and a simple joining color.",content:`<p>This flower-motif throw is built one square at a time, which makes a large blanket feel much less intimidating. The individual daisies give every motif a small focal point, while a quiet background color lets the full field of flowers read as one design.</p><h2>Choose yarn with clear stitch definition</h2><p>A smooth washable yarn works especially well for a motif blanket. Keep the flower centers and petals consistent, then use a single background shade to tie the motifs together. Before making a full stack, finish and block a few test squares to confirm the size.</p><h2>Build the flower first</h2><p>Begin at the center, form the petals, then transition the circular flower into four corners. The most important part is keeping the transition round balanced. If the petal section is too tight, the square may cup; if the background round grows too quickly, the edges may ripple.</p><div class="note"><strong>Consistency check:</strong> Measure every several motifs. Small differences are easy to correct early and much harder to hide after joining.</div><h2>Block before joining</h2><p>Blocking relaxes the square edges and gives the petals room to open. Shape all motifs to the same dimensions without flattening the raised flower centers completely.</p><h2>Join in rows</h2><p>Arrange all finished motifs before committing to seams. A simple cream join keeps attention on the daisies. Work steadily across rows and periodically spread the blanket flat to make sure the joins are not drawing the fabric inward.</p><h2>Add a quiet frame</h2><p>A narrow border is enough. The repeated flowers already provide plenty of detail, so a restrained outer edge keeps the blanket light, soft and cohesive.</p>`},
{id:"pocket-puppy",title:"Pocket-Sized Puppy",category:"Amigurumi",level:"Beginner",date:"September 3, 2026",image:"./assets/mini-puppy-amigurumi.webp",excerpt:"A tiny puppy with a rounded body, compact feet and simple floppy ears designed for a quick make.",content:`<p>Small amigurumi is ideal when you want a satisfying project without committing to many hours of assembly. This puppy uses a compact body, tiny legs and uncomplicated facial details to create a recognizable character from very little yarn.</p><h2>Use a dense fabric</h2><p>Choose smooth yarn and a hook that creates firm single crochet. The stitches should be close enough that stuffing cannot show through when the body is filled. A stitch marker is especially useful because even one missed stitch can noticeably change a miniature shape.</p><h2>Shape in continuous rounds</h2><p>Work in a spiral, increasing gradually to form the rounded section and then decreasing to close the shape. Add small amounts of stuffing as you work so it can be distributed evenly before the opening becomes too narrow.</p><h2>Keep the legs compact</h2><p>Short integrated feet preserve the no-fuss character of the project. Check the toy on a flat surface before closing so the body does not lean strongly to one side.</p><div class="note"><strong>For young children:</strong> Embroidered facial features are preferable to removable plastic components.</div><h2>Add just enough expression</h2><p>A small nose, simple eyes and one contrasting ear or face patch can provide plenty of personality. Avoid overworking the face—the charm of a miniature toy often comes from keeping details very restrained.</p><h2>Close and shape</h2><p>Add the last bit of stuffing, close the opening securely and hide the tail inside the body. Gently massage the stuffing into place until the puppy looks even from every side.</p>`},
{id:"berry-cinch-pouch",title:"Berry Cinch Pouch",category:"Small Accessory",level:"Beginner",date:"August 31, 2026",image:"./assets/strawberry-drawstring-pouch.webp",excerpt:"A playful red pouch with a leafy green edge, tiny stitched seeds and a practical drawstring closure.",content:`<p>This small pouch borrows its color story from a strawberry: a red body, green top and a scattering of pale seed stitches. The construction itself stays simple, making the project a good place to practice working in the round and adding a drawstring channel.</p><h2>Begin with a flat base</h2><p>Increase evenly until the circle reaches the width you want. Once the base is established, stop increasing and continue upward to create the pouch walls.</p><h2>Keep the side fabric compact</h2><p>Dense stitches help small objects stay inside and give the pouch enough structure to stand neatly. Cotton is particularly useful if you want a crisp finish.</p><h2>Create the cord channel</h2><p>Near the top, space chain openings evenly around the round. Test the width of the holes against the cord before finishing the decorative edge.</p><div class="note"><strong>Design restraint:</strong> A few seed stitches are more effective than covering the entire red surface.</div><h2>Finish with a leafy edge</h2><p>Simple points or shallow scallops in green suggest the top of a strawberry without interfering with the opening. Add a chain, braid or twisted cord and thread it through the eyelets.</p><h2>Use it for tiny essentials</h2><p>The finished pouch is well suited to stitch markers, jewelry, earbuds or small gifts. It is also a useful stash-busting project because each color requires only a modest amount of yarn.</p>`},
{id:"field-flower-headband",title:"Field-Flower Headband",category:"Wearable",level:"Easy",date:"August 29, 2026",image:"./assets/boho-flower-headband.webp",excerpt:"A slim sage band finished with three small crochet flowers in muted vintage-inspired shades.",content:`<p>A narrow crochet headband needs very little yarn, but careful sizing makes a big difference in how comfortable it feels. This version uses a clean slim band as the base and lets three small flowers provide the decoration.</p><h2>Choose soft yarn</h2><p>Because the band sits directly against the head, select a smooth fiber that does not feel scratchy. DK or light worsted yarn keeps the piece flexible and avoids bulky seams.</p><h2>Measure with stretch in mind</h2><p>The band should be slightly shorter than the head circumference so it stays in place without pressure. Test the fabric by stretching it gently before deciding on the final length.</p><h2>Make a simple strip</h2><p>A few tidy rows of single crochet, half double crochet or subtle ribbing are enough. Keep the edges even because they remain visible in the finished piece.</p><h2>Add a small flower cluster</h2><p>Five-petal flowers are easy to arrange and light enough for a headband. Lay them in position before sewing, then secure the centers and a few inner petal points while leaving the outer edges free.</p><div class="note"><strong>Placement idea:</strong> Shift the flowers slightly off-center for a relaxed handmade look.</div><h2>Join the band neatly</h2><p>Sew the short ends with a flat seam and hide every tail inside the stitches. A light block can help the flowers open without stretching the band itself.</p>`},
{id:"sage-slouch-bag",title:"Sage Slouch Shoulder Bag",category:"Bag Study",level:"Intermediate",date:"August 26, 2026",image:"./assets/sage-hobo-bag.webp",excerpt:"A relaxed shoulder bag with a curved body, dense stitch texture and a broad strap that grows from the upper edges.",content:`<p>This soft hobo-style bag relies on shape rather than decoration. A dense stitch surface, gradual curves and a broad integrated strap give it a quiet, practical silhouette that works well in a single muted color.</p><h2>Balance structure and drape</h2><p>Cotton and cotton blends are useful because they hold stitch definition while still softening with use. Make a swatch and stretch it before starting; the bag should bend easily without opening large gaps.</p><h2>Shape the lower body gradually</h2><p>Controlled increases establish width through the lower half. Once the broadest section is reached, even rows create the center before matching decreases bring the fabric back toward the opening.</p><h2>Grow the strap from the sides</h2><p>Continuing the upper edges directly into the strap produces a cleaner look than attaching a separate handle. Keep the strap wide enough to distribute weight comfortably across the shoulder.</p><div class="note"><strong>Stress-point check:</strong> Reinforce the places where the strap narrows into the body. Those transitions carry most of the load.</div><h2>Consider a lining</h2><p>A simple fabric lining reduces stretching and keeps small objects from working through the stitches. Add any interior pocket before sewing the lining into place.</p><h2>Block with restraint</h2><p>Shape the finished bag gently without pulling the strap longer. The goal is to smooth the body while preserving its relaxed slouch.</p>`},
{id:"heirloom-lace-round",title:"Heirloom Lace Round",category:"Home",level:"Intermediate",date:"August 23, 2026",image:"./assets/lace-doily.webp",excerpt:"An ivory round worked outward through open arches before finishing in a crisp repeating scalloped edge.",content:`<p>Thread crochet rewards precision. This round lace piece begins with a compact center and becomes increasingly open as chain spaces and arches create a light, traditional surface.</p><h2>Start with comfortable materials</h2><p>Cotton crochet thread gives the crispest result, though a slightly thicker cotton can make the first attempt easier. Choose a hook that lets you maintain even tension without straining your hands.</p><h2>Count every repeat</h2><p>The early rounds establish the geometry of the entire piece. Check the repeat count before moving on, especially when solid stitches begin alternating with open chains.</p><div class="note"><strong>Shape clue:</strong> Strong cupping can signal too few increases or overly tight chains; heavy ruffling can indicate the opposite.</div><h2>Let the outer rounds open up</h2><p>Repeated arches create the lace character. Keep chain lengths consistent so the pattern stays balanced and each section reaches the next round evenly.</p><h2>Finish the scallops carefully</h2><p>Work each outer repeat with the same stitch count. Do not worry if the edge looks slightly untidy straight from the hook; blocking will define the final geometry.</p><h2>Block as part of the project</h2><p>Dampen the finished lace, pin the center and then work outward evenly. Shape each scallop individually and allow the piece to dry completely before removing the pins.</p>`},
{id:"rose-heart-cushion",title:"Rose Heart Cushion",category:"Home",level:"Easy–Intermediate",date:"August 20, 2026",image:"./assets/heart-granny-pillow.webp",excerpt:"A large dusty-rose heart sits inside a cream crochet square, framed by a narrow sage edge for a soft graphic cushion.",content:`<p>A single oversized motif can make a crochet cushion feel both handmade and graphic. Here the heart is built into the front panel with color changes, keeping the surface flatter than a separate appliqué would.</p><h2>Work toward the insert size</h2><p>Select the cushion insert first and use its measurements as the target. Crochet fabric stretches, so a cover that is just slightly smaller than the insert often creates a fuller finished shape.</p><h2>Keep the color plan simple</h2><p>Cream, dusty rose and sage provide contrast without making the design busy. A smooth medium-weight yarn keeps the heart edges readable and gives the cover enough body.</p><h2>Center the motif carefully</h2><p>Track stitch counts on both sides of the heart as the panel grows. Clean color changes are especially important along diagonal sections because uneven transitions are easy to notice in a large central motif.</p><div class="note"><strong>Clean change:</strong> Bring in the new color during the final yarn-over of the preceding stitch.</div><h2>Build a plain back</h2><p>A simple solid panel keeps the focus on the front. For a removable cover, use two overlapping back pieces to create an envelope opening.</p><h2>Join and fill</h2><p>Block the panels lightly, join the outer edges and insert the cushion form. Shape the corners by hand so the finished piece sits evenly and the heart remains centered.</p>`}
];

const pages={
about:{title:"About Thread & Timber",body:`<p>Thread &amp; Timber is an independent-style crochet journal built around useful handmade projects, clear construction notes and ideas worth adapting to your own yarn shelf.</p><h2>Our approach</h2><p>We prefer projects that can be understood visually and made without unnecessary complication. The focus is on thoughtful color, practical finishing and approachable techniques.</p><h2>What appears here</h2><ul><li>Granny-square projects and motif studies</li><li>Practical crochet bags and small accessories</li><li>Blankets and home pieces</li><li>Compact amigurumi and wearable ideas</li></ul><p>The articles are intended as creative guidance and project notes rather than a substitute for a purchased designer pattern where one is required.</p>`},
privacy:{title:"Privacy Notice",body:`<p><strong>Effective date:</strong> September 21, 2026</p><p>This site may receive basic technical information when you visit, including browser or device details, referring pages and standard server-log data.</p><h2>Cookies and analytics</h2><p>Cookies or similar technologies may be used for site functionality, traffic measurement, analytics or advertising services when those features are enabled.</p><h2>Third-party providers</h2><p>Services supplied by other companies may process information under their own terms and privacy policies. Their practices are controlled by those providers rather than by this website.</p><h2>Your browser controls</h2><p>You can limit or remove cookies using your browser settings. Disabling certain technologies may affect parts of the site that depend on them.</p><h2>Questions</h2><p>Use the contact page if you have a privacy question relating specifically to this website.</p>`},
terms:{title:"Site Terms",body:`<p><strong>Effective date:</strong> September 21, 2026</p><p>By accessing this website, you agree to use it only for lawful purposes and in a way that does not interfere with the site or other visitors.</p><h2>Crochet information</h2><p>Project notes are provided for general creative and informational use. Results can vary because yarn, hook size, tension, substitutions and individual technique affect the finished item.</p><h2>Content rights</h2><p>Unless stated otherwise, original written content, site branding and original visual materials may not be copied or republished in full without permission.</p><h2>External resources</h2><p>Links to outside websites are provided for convenience. We do not control third-party availability, content or policies.</p><h2>Changes</h2><p>These terms may be updated as the website changes. Continued use of the site after an update means the revised terms apply to future visits.</p>`},
contact:{title:"Contact the Journal",body:`<p>Questions, corrections and collaboration notes are welcome.</p><div class="contact-card"><strong>Email:</strong> hello@example.com<p style="margin-bottom:0">Replace this placeholder address with the inbox you want to use publicly.</p></div><h2>Project questions</h2><p>If you are writing about one of the crochet projects, include the project title and describe the part you are working on so the question has enough context.</p>`}
};

function storyCard(p){return `<article class="story"><button onclick="navigate('post','${p.id}')"><img class="story-img" src="${p.image}" alt="${p.title}" onerror="this.style.opacity='.15'"><div class="story-body"><div class="tagline"><span>${p.category}</span><span>·</span><span>${p.level}</span></div><h3>${p.title}</h3><p>${p.excerpt}</p><div class="story-link">Open project notes →</div></div></button></article>`}
function renderHome(){document.getElementById('app').innerHTML=`<div class="wrap"><section class="home-hero"><div class="hero-copy"><span class="kicker">The handmade issue</span><h1>Make less. Make it well.</h1><p>A crochet journal for useful bags, tactile blankets, small accessories and quiet projects that earn a place in everyday life.</p><div class="hero-actions"><a class="btn btn-light" onclick="jumpProjects()">Explore projects</a><a class="btn btn-outline" onclick="navigate('page','about')">Read our story</a></div></div><div class="hero-photo"><img src="./assets/hero-crochet-studio.webp" alt="Crochet workspace with yarn and handmade pieces"><div class="hero-label">Issue 01 · September 2026</div></div></section><div class="strip"><span><strong>8</strong> project studies</span><span>Motifs · bags · home · amigurumi</span><span>Designed for calm, practical making</span></div><section id="projects"><div class="section-head"><h2>From the worktable</h2><p>Each project is presented as a focused set of construction notes: what matters, what to watch, and how to finish the piece cleanly.</p></div><div class="story-grid">${projects.map(storyCard).join('')}</div></section></div>`;window.scrollTo(0,0)}
function renderPost(id){const p=projects.find(x=>x.id===id);if(!p){renderNotFound();return}document.getElementById('app').innerHTML=`<div class="wrap page"><button class="crumb" onclick="navigate('home')">← Journal index</button><article class="article"><div class="article-top"><div class="article-title"><div class="tagline"><span>${p.category}</span><span>·</span><span>${p.level}</span><span>·</span><span>${p.date}</span></div><h1>${p.title}</h1><p>${p.excerpt}</p><div class="byline"><img src="${authorImage}" alt=""> Thread &amp; Timber Studio</div></div><img src="${p.image}" alt="${p.title}"></div><div class="article-content">${p.content}</div></article></div>`;window.scrollTo(0,0)}
function renderPage(id){const p=pages[id];if(!p){renderNotFound();return}document.getElementById('app').innerHTML=`<div class="wrap page"><button class="crumb" onclick="navigate('home')">← Return to journal</button><section class="legal"><div class="kicker">Thread &amp; Timber</div><h1>${p.title}</h1>${p.body}</section></div>`;window.scrollTo(0,0)}
function renderNotFound(){document.getElementById('app').innerHTML=`<div class="not-found"><div class="kicker">404</div><h1>That page is off the hook.</h1><p>We could not find the project you requested.</p><button class="btn btn-light" onclick="navigate('home')">Return to journal</button></div>`}
function jumpProjects(){history.replaceState(null,'',window.location.pathname+window.location.search+'#projects');renderHome();requestAnimationFrame(()=>{const el=document.getElementById('projects');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})}
function navigate(view,id=null){if(view==='home'){window.location.hash='';renderHome()}else if(view==='post'){window.location.hash='project/'+id;renderPost(id)}else if(view==='page'){window.location.hash='page/'+id;renderPage(id)}}
function routeFromHash(){const hash=window.location.hash.replace(/^#/,'');if(!hash){renderHome();return}if(hash==='projects'){renderHome();requestAnimationFrame(()=>{const el=document.getElementById('projects');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});return}const [kind,...rest]=hash.split('/');const id=rest.join('/');if(kind==='project')renderPost(id);else if(kind==='page')renderPage(id);else renderNotFound()}
window.addEventListener('hashchange',routeFromHash);
routeFromHash();
</script>
</body>
</html>
